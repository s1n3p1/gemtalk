<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GemTalk</title><meta name="theme-color" content="#f5f3eb"><meta name="msapplication-TileColor" content="#f5f3eb">
  <meta name="application-name" content="GemTalk"><meta name="apple-mobile-web-app-title" content="GemTalk">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1"><link rel="icon" type="image/x-icon" href="./favicon.ico?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png?v=1"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1"><link rel="apple-touch-icon-precomposed" href="./apple-touch-icon-precomposed.png?v=1">
  <link rel="mask-icon" href="./safari-pinned-tab.svg?v=1" color="#3a4939"><link rel="manifest" href="./site.webmanifest?v=2">
  <link rel="stylesheet" href="./fonts.css?v=1"><link rel="stylesheet" href="./app.css?v=18">
  <script src="./app.js?v=18" type="module"></script>
</head>
<body>
<div class="app-shell" hidden>
  <main class="main">
    <header class="topbar"><a class="brand" href="#" aria-label="GemTalk 수다 목록" data-i18n-aria="rooms"><img src="./favicon.svg?v=1" alt="" width="34" height="34"><span>GemTalk<span class="brand-dot">.</span></span></a><div class="topbar-right" dir="ltr"><button id="members-open" type="button" class="icon-button" aria-label="멤버" data-i18n-aria="members"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></svg></button><button id="theme-button" type="button" class="icon-button theme-button" aria-label="다크"><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a8.5 8.5 0 0 1-11-11 8.5 8.5 0 1 0 11 11Z"/></svg></button><button id="settings-open" class="icon-button" aria-label="시스템 설정" data-i18n-aria="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg></button></div></header>
    <section id="list-view" class="list-view"><div class="list-heading"><h1 data-i18n="rooms">수다</h1><button id="list-new" class="play-button"><span data-i18n="new_room">새로운 수다</span> <span aria-hidden="true">＋</span></button></div><div id="room-list" class="room-list"></div><div id="list-empty" class="list-empty" hidden><div class="empty-avatars" aria-hidden="true"></div><p data-i18n="empty_prompt">어떤 얘기부터 할까?</p><button id="empty-new" class="primary-button"><span data-i18n="first_room">첫 수다 열기</span> <span aria-hidden="true">↗</span></button></div><footer class="list-footer"><span id="list-model" dir="ltr">Gemini 3.8 Flash (Low)</span> <span id="connection" class="connection" data-i18n="connecting" role="status">연결 중</span></footer></section>
    <section id="chat-view" hidden>
      <button id="back-list" class="back-button" hidden><span aria-hidden="true">←</span> <span data-i18n="back_list">수다 목록</span></button>
      <div class="room-heading"><div><div class="room-kicker"><span id="status-dot" class="status-dot"></span><span id="status-text"></span><span>·</span><span id="turn-count"></span></div><h1 id="topic-title"></h1><div id="room-details" class="room-details"></div></div><button id="play" class="play-button"><span id="play-symbol" aria-hidden="true">Ⅱ</span><span id="play-label">잠깐 쉬기</span></button></div>
      <div class="conversation-wrap">
        <div class="room-scene" id="room-scene" aria-hidden="true">
          <div class="scene-window"><span></span><span></span><span></span><span></span></div>
          <div class="scene-art"><svg viewBox="0 0 76 96"><rect x="1" y="1" width="74" height="94" rx="2" fill="#ebe6d8" stroke="#bcb9ac"/><path d="M13 73c6-25 20-10 26-30s15-17 24-23v62H13Z" fill="#92a18a"/><circle cx="24" cy="27" r="10" fill="#d5a272"/></svg></div>
          <div class="scene-plant"><svg viewBox="0 0 70 140"><path d="M33 113V38m0 48L15 69m18-4 20-21" stroke="#74866a" stroke-width="3" fill="none"/><ellipse cx="16" cy="63" rx="10" ry="20" transform="rotate(-42 16 63)" fill="#889777"/><ellipse cx="50" cy="39" rx="10" ry="22" transform="rotate(42 50 39)" fill="#8fa080"/><ellipse cx="31" cy="31" rx="10" ry="23" fill="#a3ae90"/><path d="m13 105 40 0-6 31H19Z" fill="#b6795d"/></svg></div>
          <div class="sofa"><span class="sofa-back"></span><span class="sofa-seat"></span><span class="sofa-foot left"></span><span class="sofa-foot right"></span></div>
          <div id="scene-people" class="scene-people"></div>
          <div class="coffee-table"><span class="cup cup-one"></span><span class="cup cup-two"></span><span class="table-top"></span><span class="table-leg one"></span><span class="table-leg two"></span></div>
          <span class="scene-floor"></span>
        </div>
        <div id="messages" class="messages" role="log" aria-label="멤버들의 대화" data-i18n-aria="chat_log" aria-live="polite" aria-relevant="additions"></div>
        <div id="thinking" class="thinking" hidden></div><div id="room-notice" class="room-notice" hidden></div>
      </div>
      <footer class="composer-footer"><button id="jump-live" class="jump-live" hidden><span data-i18n="new_messages">새로운 말</span> ↓</button><form id="interject-form" class="composer"><span aria-hidden="true">↗</span><input id="interject" maxlength="1000" placeholder="가끔은 나도 한마디" data-i18n-placeholder="interject_placeholder" autocomplete="off" aria-label="멤버들에게 한마디" data-i18n-aria="interject_label"><button aria-label="한마디 보내기" data-i18n-aria="send_interject" id="send-interject" type="submit">↑</button></form></footer>
    </section>
  </main>
</div>
<dialog id="new-dialog"><form id="new-form"><div class="dialog-head"><h2 data-i18n="new_room">새로운 수다</h2><button type="button" class="icon-button" data-close aria-label="닫기" data-i18n-aria="close">×</button></div><label for="new-topic" data-i18n="topic">무슨 얘기할까?</label><input id="new-topic" maxlength="300" placeholder="그냥 아무 얘기" data-i18n-placeholder="topic_placeholder" autocomplete="off"><div id="new-topic-chips" class="topic-chips"></div><div class="field-heading"><span data-i18n="participants">함께할 멤버</span><button id="select-all" type="button" class="text-button" data-i18n="select_all">모두 선택</button></div><div id="member-choices" class="member-choices"></div><label for="new-language" data-i18n="conversation_language">대화 언어</label><select id="new-language"></select><button class="primary-button" type="submit"><span data-i18n="start_room">모여서 수다 떨기</span> <span aria-hidden="true">↗</span></button><p id="new-error" class="form-error" hidden></p></form></dialog>
<dialog id="members-dialog" class="members-dialog" aria-labelledby="members-heading"><div class="dialog-head"><h2 id="members-heading" data-i18n="members">멤버</h2><div class="members-actions"><button id="add-member" type="button" class="icon-button" aria-label="멤버 추가" data-i18n-aria="add_member">＋</button><button type="button" class="icon-button" data-close aria-label="닫기" data-i18n-aria="close">×</button></div></div><div id="cast" class="cast"></div></dialog>
<dialog id="member-dialog"><form id="member-form"><div class="dialog-head"><h2 id="member-title" data-i18n="add_member">멤버 추가</h2><button type="button" class="icon-button" data-close aria-label="닫기" data-i18n-aria="close">×</button></div><div id="member-preview" class="member-preview"></div><div id="avatar-options" class="avatar-options" role="group" aria-label="기본 프로필 사진" data-i18n-aria="default_photos"></div><div class="photo-actions"><label for="avatar-file" class="photo-upload" data-i18n="upload_photo">사진 올리기</label><input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><button type="button" id="use-avatar-url" class="text-button" data-i18n="photo_url">사진 주소 사용</button></div><input id="avatar-url" type="url" placeholder="https://…" aria-label="프로필 사진 주소" data-i18n-aria="photo_url_label" hidden><label for="member-name" data-i18n="name">이름</label><input id="member-name" maxlength="80" required autocomplete="off"><label for="member-personality" data-i18n="personality">성격</label><textarea id="member-personality" rows="4" maxlength="4000" required></textarea><label for="member-label"><span data-i18n="label">짧은 소개</span> <span class="optional" data-i18n="optional">선택</span></label><input id="member-label" maxlength="80"><p class="field-note" data-i18n="profile_note">편집하거나 삭제해도 기존 수다의 멤버는 그대로 남아요.</p><button class="primary-button" type="submit" data-i18n="save">저장</button><button id="delete-member" class="delete-button" type="button" data-i18n="delete_member" hidden>멤버 삭제</button><p id="member-error" class="form-error" hidden></p></form></dialog>
<dialog id="delete-dialog"><div class="dialog-head"><h2 data-i18n="delete_member">멤버 삭제</h2><button type="button" class="icon-button" data-close aria-label="닫기" data-i18n-aria="close">×</button></div><p id="delete-question"></p><button id="confirm-delete" class="primary-button danger" data-i18n="delete">삭제</button><button class="secondary-button" data-close data-i18n="cancel">취소</button></dialog>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-head"><h2 data-i18n="settings">시스템 설정</h2><button type="button" class="icon-button" data-close aria-label="닫기" data-i18n-aria="close">×</button></div><div class="language-grid"><div><label for="setting-ui-language" data-i18n="ui_language">화면 언어</label><select id="setting-ui-language"></select></div><div><label for="setting-language" data-i18n="default_language">기본 대화 언어</label><select id="setting-language"></select></div></div><div class="field-heading"><label for="setting-model" data-i18n="model">새 수다의 모델</label><button type="button" id="refresh-models" class="text-button" data-i18n="refresh">새로고침</button></div><select id="setting-model"></select><p id="model-error" class="form-error" hidden></p><label for="setting-limit" data-i18n="limit">수다당 대화 개수 제한</label><input id="setting-limit" type="number" min="0" step="1" required><p class="field-note" data-i18n="limit_note">0이면 중단하기 전까지 계속해요.</p><div class="form-grid"><div><label for="setting-pace" data-i18n="pace">말 사이 간격 · 초</label><input id="setting-pace" type="number" min="0" max="600" required></div><div><label for="setting-away-time" data-i18n="away_time">자리 비움 대기 · 초</label><input id="setting-away-time" type="number" min="15" max="3600" required></div></div><label class="toggle-row"><span data-i18n="pause_away">자리를 비우면 잠시 멈춤</span><input id="setting-away" type="checkbox"></label><label class="toggle-row"><span data-i18n="animation">기본 캐릭터 움직임</span><input id="setting-animation" type="checkbox"></label><p class="field-note" data-i18n="settings_note">모델과 기본 언어는 새 수다부터 적용돼요. 한 번에 한 수다가 진행돼요.</p><button class="primary-button settings-save" type="submit" data-i18n="save">저장</button><div class="settings-danger-actions"><button id="reset-settings" class="secondary-button" type="button" data-i18n="reset_settings">설정 초기화</button><button id="delete-history" class="secondary-button destructive-button" type="button" data-i18n="delete_history">대화 내역 전체 삭제</button></div><p id="settings-error" class="form-error" hidden></p></form></dialog>
<dialog id="action-dialog" class="action-confirm" aria-labelledby="action-heading"><div class="dialog-head"><h2 id="action-heading"></h2><button type="button" class="icon-button" data-close aria-label="닫기" data-i18n-aria="close">×</button></div><p id="action-question"></p><p id="action-error" class="form-error" hidden></p><button id="confirm-action" type="button" class="primary-button"></button><button id="cancel-action" class="secondary-button" type="button" data-close data-i18n="cancel">취소</button></dialog>
<dialog id="locale-dialog" aria-labelledby="locale-heading"><div class="welcome-brand"><img src="./favicon.svg?v=1" width="46" height="46" alt=""><h1>GemTalk<span class="brand-dot">.</span></h1></div><h2 id="locale-heading">Choose your language</h2><div id="locale-choices" class="language-choices"></div><button id="locale-continue" class="primary-button">Continue <span aria-hidden="true">→</span></button><p id="locale-error" class="form-error" role="alert" hidden></p></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
